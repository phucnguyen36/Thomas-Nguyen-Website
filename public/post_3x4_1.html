<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 1 — Motivation vs Discipline (Neue Haas Grotesk)</title>
  <style>
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-45Light-Trial.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-55Roman-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Neue Haas Grotesk', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #030406;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 80px;
    }

    /* High-clarity architectural photo background */
    .bg-photo {
      position: absolute;
      inset: 0;
      background-image: url('skyscraper_night.jpg');
      background-size: cover;
      background-position: center 42%;
      filter: contrast(1.18) brightness(0.96) saturate(0.82);
      transform: scale(1.02);
    }

    /* Architectural grade: preserves concrete lines while deepening space */
    .lighting-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 48% 65%, rgba(255, 170, 70, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at center, transparent 35%, rgba(2, 3, 5, 0.65) 100%),
                  linear-gradient(180deg, rgba(2, 3, 5, 0.5) 0%, transparent 18%, transparent 82%, rgba(2, 3, 5, 0.8) 100%);
      pointer-events-none;
      z-index: 2;
    }

    /* Ultra-fine 35mm film grain */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events-none;
      z-index: 3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Clean iOS Toggles */
    .toggle-section {
      position: absolute;
      top: 510px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 250px;
    }

    .toggle-label {
      font-size: 21px;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    }

    .switch {
      width: 58px;
      height: 34px;
      border-radius: 999px;
      padding: 3px;
      display: flex;
      align-items: center;
    }

    .switch.off {
      background: #393c46;
      justify-content: flex-start;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .switch.on {
      background: #1591DC;
      justify-content: flex-end;
      box-shadow: 0 0 26px rgba(21, 145, 220, 0.9), 0 0 10px rgba(21, 145, 220, 0.95);
    }

    .thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    /* Minimal Quote beside the warm window */
    .quote-box {
      position: absolute;
      left: 175px;
      top: 928px;
      z-index: 10;
      font-size: 21px;
      line-height: 1.35;
      letter-spacing: -0.01em;
      text-shadow: 0 3px 16px rgba(0,0,0,0.95);
    }

    /* Bottom Watermark - Strictly Lowercase Neue Haas Grotesk */
    .watermark {
      position: absolute;
      bottom: 60px;
      z-index: 10;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bg-photo"></div>
    <div class="lighting-overlay"></div>
    <div class="grain"></div>

    <!-- iOS Toggles floating on building -->
    <div class="toggle-section">
      <div class="toggle-row">
        <span class="toggle-label" style="color: #9295a6; font-weight: 400;">motivation</span>
        <div class="switch off"><div class="thumb"></div></div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label" style="color: #ffffff; font-weight: 600;">discipline</span>
        <div class="switch on"><div class="thumb"></div></div>
      </div>
    </div>

    <!-- Quote next to lit window -->
    <div class="quote-box">
      <div style="color: #8c90a2; font-weight: 400;">one day.</div>
      <div style="color: #555869; font-size: 17px; margin: 2px 0; font-weight: 400;">or</div>
      <div style="color: #ffffff; font-weight: 600;">day one.</div>
    </div>

    <!-- Bottom Watermark -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
