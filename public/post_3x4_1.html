<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 1 — Motivation vs Discipline (3:4 Minimal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #050608;
      background-image: url('skyscraper_night.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 80px;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.72) 100%),
                  linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.75) 100%);
      pointer-events-none;
      z-index: 2;
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      pointer-events-none;
      z-index: 3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* iOS Toggles Container */
    .toggle-section {
      position: absolute;
      top: 505px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 250px;
    }
    .toggle-label {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    .switch {
      width: 58px;
      height: 34px;
      border-radius: 999px;
      padding: 3px;
      display: flex;
      align-items: center;
    }
    .switch.off {
      background: #41444e;
      justify-content: flex-start;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }
    .switch.on {
      background: #1591DC;
      justify-content: flex-end;
      box-shadow: 0 0 24px rgba(21, 145, 220, 0.85), 0 0 10px rgba(21, 145, 220, 0.95);
    }
    .thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* Quote Callout */
    .quote-box {
      position: absolute;
      left: 175px;
      top: 925px;
      z-index: 10;
      font-size: 21px;
      font-weight: 500;
      line-height: 1.35;
      text-shadow: 0 2px 14px rgba(0,0,0,0.95);
    }

    /* Minimal Watermark */
    .watermark {
      position: absolute;
      bottom: 60px;
      z-index: 10;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.16em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="vignette"></div>
    <div class="grain"></div>

    <!-- iOS Toggles floating on building -->
    <div class="toggle-section">
      <div class="toggle-row">
        <span class="toggle-label" style="color: #9da0b0;">motivation</span>
        <div class="switch off"><div class="thumb"></div></div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label" style="color: #ffffff; font-weight: 600;">discipline</span>
        <div class="switch on"><div class="thumb"></div></div>
      </div>
    </div>

    <!-- "one day or day one." text next to lit window -->
    <div class="quote-box">
      <div style="color: #8c90a2;">one day.</div>
      <div style="color: #555869; font-size: 17px; margin: 2px 0;">or</div>
      <div style="color: #ffffff; font-weight: 700;">day one.</div>
    </div>

    <!-- Bottom Watermark (Strictly Lowercase) -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
