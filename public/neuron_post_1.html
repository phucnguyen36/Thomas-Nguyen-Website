<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 1 — Rely on Discipline (Stoic)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .canvas {
      width: 1080px;
      height: 1350px;
      background-color: #040507;
      background-image: 
        radial-gradient(circle at center, rgba(4, 5, 8, 0.45) 0%, rgba(4, 5, 8, 0.92) 85%),
        linear-gradient(180deg, rgba(4, 5, 8, 0.8) 0%, rgba(4, 5, 8, 0.25) 30%, rgba(4, 5, 8, 0.25) 70%, rgba(4, 5, 8, 0.9) 100%),
        url('statue_stoic.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 100px 90px;
    }
    /* Tactile Grain Overlay */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      pointer-events-none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .watermark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: #9da0b0;
      text-transform: uppercase;
      position: relative;
      z-index: 10;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .label {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <!-- Top Watermark -->
    <div class="watermark">@THOMASVISUALEDITOR</div>

    <!-- Main Visual Container -->
    <div style="width: 100%; max-width: 840px; display: flex; flex-direction: column; gap: 150px; margin: auto 0; position: relative; z-index: 10;">
      
      <!-- Top Section: Don't Rely on Motivation -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 35px; width: 100%;">
        <div class="label" style="color: #9295a6;">DON'T RELY ON MOTIVATION</div>
        
        <div style="width: 100%; display: flex; justify-content: center;">
          <svg width="780" height="130" viewBox="0 0 780 130" fill="none" style="overflow: visible;">
            <!-- Baseline -->
            <line x1="20" y1="110" x2="760" y2="110" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
            
            <!-- Decaying Bounces -->
            <path d="M 40 110 Q 155 -15 270 110" stroke="#b0b3c2" stroke-width="2.6" fill="none" style="filter: drop-shadow(0 0 6px rgba(0,0,0,0.8));"/>
            <path d="M 270 110 Q 360 30 450 110" stroke="#7e8192" stroke-width="2.2" fill="none"/>
            <path d="M 450 110 Q 515 65 580 110" stroke="#565968" stroke-width="2" fill="none"/>
            <path d="M 580 110 Q 620 88 660 110" stroke="#3d404d" stroke-width="1.8" fill="none"/>
            
            <!-- Flat dotted line fizzling out -->
            <line x1="660" y1="110" x2="750" y2="110" stroke="#3d404d" stroke-width="2" stroke-dasharray="4 6"/>
            
            <!-- Starting node -->
            <circle cx="40" cy="110" r="5.5" fill="#ffffff" style="filter: drop-shadow(0 0 8px #ffffff);"/>
            <!-- Ending dead node -->
            <circle cx="750" cy="110" r="4" fill="#3d404d"/>
          </svg>
        </div>
      </div>

      <!-- Bottom Section: Rely on Discipline -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 35px; width: 100%;">
        <div class="label" style="color: #ffffff;">
          RELY ON <span style="color: #1591DC; text-shadow: 0 0 25px rgba(21,145,220,0.9);">DISCIPLINE</span>
        </div>

        <div style="width: 100%; display: flex; justify-content: center;">
          <svg width="780" height="130" viewBox="0 0 780 130" fill="none" style="overflow: visible;">
            <!-- Baseline -->
            <line x1="20" y1="110" x2="760" y2="110" stroke="rgba(21,145,220,0.18)" stroke-width="1.5"/>

            <!-- Continuous Rhythmic Arcs (all identical, disciplined cadence) -->
            <path d="M 40 110 
                     Q 70 55 100 110 
                     Q 130 55 160 110 
                     Q 190 55 220 110 
                     Q 250 55 280 110 
                     Q 310 55 340 110 
                     Q 370 55 400 110 
                     Q 430 55 460 110 
                     Q 490 55 520 110 
                     Q 550 55 580 110 
                     Q 610 55 640 110 
                     Q 670 55 700 110 
                     Q 730 55 760 110" 
                  stroke="#1591DC" stroke-width="2.8" fill="none"
                  style="filter: drop-shadow(0 0 12px rgba(21,145,220,0.85));"/>

            <!-- Starting Node -->
            <circle cx="40" cy="110" r="5.5" fill="#ffffff" style="filter: drop-shadow(0 0 8px #ffffff);"/>

            <!-- Glowing Terminal Node -->
            <circle cx="760" cy="110" r="7" fill="#ffffff" stroke="#1591DC" stroke-width="3"
                    style="filter: drop-shadow(0 0 16px #1591DC);"/>
          </svg>
        </div>
      </div>

    </div>

    <!-- Bottom Footer Watermark -->
    <div style="display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: #828698; letter-spacing: 0.16em; position: relative; z-index: 10;" class="mono">
      <span>00:00:00:00</span>
      <span style="letter-spacing: 0.24em; font-weight: 600;">THOMASNGUYEN.ONLINE</span>
      <span>01:24:16:12</span>
    </div>

  </div>
</body>
</html>
