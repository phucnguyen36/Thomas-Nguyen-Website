<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 1 — One Day or Day One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 85px 80px;
      background-color: #050608;
    }
    /* Photographic Background Layer */
    .bg-photo {
      position: absolute;
      inset: 0;
      background-image: url('bg_post_1.jpg');
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) brightness(0.65) contrast(1.25);
      z-index: 1;
    }
    /* Dark Vignette & Atmospheric Overlay */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(5, 6, 8, 0.2) 0%, rgba(5, 6, 8, 0.75) 75%, rgba(5, 6, 8, 0.95) 100%),
                  linear-gradient(180deg, rgba(5, 6, 8, 0.8) 0%, transparent 20%, transparent 80%, rgba(5, 6, 8, 0.9) 100%);
      z-index: 2;
    }
    /* Tactile 35mm Film Grain Noise */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      pointer-events-none;
      z-index: 3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    /* Content Container */
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    /* Header Watermark */
    .watermark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }
    /* Minimal iOS Switch */
    .toggle-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 250px;
    }
    .toggle-label {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .switch-pill {
      width: 54px;
      height: 30px;
      border-radius: 999px;
      padding: 3px;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
    }
    .switch-pill.off {
      background: rgba(255, 255, 255, 0.25);
      justify-content: flex-start;
    }
    .switch-pill.on {
      background: #1591DC;
      justify-content: flex-end;
      box-shadow: 0 0 20px rgba(21, 145, 220, 0.8), 0 0 40px rgba(21, 145, 220, 0.3);
    }
    .switch-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    /* Typography Punch */
    .punch-text {
      text-align: center;
      font-size: 40px;
      line-height: 1.2;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: -0.02em;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }
    .punch-text span {
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.95);
    }
    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bg-photo"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="content">
      <!-- Top Watermark -->
      <div class="watermark mono">@THOMASVISUALEDITOR</div>

      <!-- Center Minimalist Hero Focus -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 70px; margin: auto 0; width: 100%;">
        
        <!-- Toggle Group -->
        <div class="toggle-wrap">
          <div class="toggle-item">
            <span class="toggle-label" style="color: rgba(255, 255, 255, 0.45);">Motivation</span>
            <div class="switch-pill off"><div class="switch-dot"></div></div>
          </div>
          <div class="toggle-item">
            <span class="toggle-label" style="color: #ffffff; font-weight: 700;">Discipline</span>
            <div class="switch-pill on"><div class="switch-dot"></div></div>
          </div>
        </div>

        <!-- Typography & Subtle Context -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <div class="punch-text">
            one day.<br>
            or<br>
            <span>day one.</span>
          </div>

          <!-- Video Editing Context -->
          <div class="mono" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #1591DC; text-transform: uppercase; margin-top: 10px; background: rgba(21, 145, 220, 0.12); padding: 6px 18px; border-radius: 999px; border: 1px solid rgba(21, 145, 220, 0.3);">
            16 HOURS ON THE TIMELINE // 02:14 AM
          </div>
        </div>

      </div>

      <!-- Bottom Footer -->
      <div class="footer mono">
        <span>00:00:00:00</span>
        <span style="letter-spacing: 0.28em; font-weight: 600;">THOMASNGUYEN.ONLINE</span>
        <span>02:14:38:12</span>
      </div>
    </div>
  </div>
</body>
</html>
