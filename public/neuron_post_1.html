<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 1 — Rely on Discipline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .canvas {
      width: 1080px;
      height: 1350px;
      background-color: #040507;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 100px 90px;
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events-none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .watermark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: #383b48;
      text-transform: uppercase;
      position: relative;
      z-index: 10;
    }
    .label {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <div class="watermark">@THOMASVISUALEDITOR</div>

    <div style="width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 150px; margin: auto 0; position: relative; z-index: 10;">
      
      <!-- Don't Rely on Motivation -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%;">
        <div class="label" style="color: #636674;">DON'T RELY ON MOTIVATION</div>
        
        <div style="width: 100%; display: flex; justify-content: center;">
          <svg width="760" height="130" viewBox="0 0 760 130" fill="none" style="overflow: visible;">
            <line x1="20" y1="110" x2="740" y2="110" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
            <path d="M 40 110 Q 150 -15 260 110" stroke="#717482" stroke-width="2.5" fill="none"/>
            <path d="M 260 110 Q 345 35 430 110" stroke="#545766" stroke-width="2.2" fill="none"/>
            <path d="M 430 110 Q 495 65 560 110" stroke="#3e414f" stroke-width="2" fill="none"/>
            <path d="M 560 110 Q 600 88 640 110" stroke="#2e313c" stroke-width="1.8" fill="none"/>
            <line x1="640" y1="110" x2="730" y2="110" stroke="#2a2c37" stroke-width="2" stroke-dasharray="4 6"/>
            <circle cx="40" cy="110" r="5" fill="#ffffff"/>
            <circle cx="730" cy="110" r="4" fill="#2a2c37"/>
          </svg>
        </div>
      </div>

      <!-- Rely on Discipline -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%;">
        <div class="label" style="color: #ffffff;">
          RELY ON <span style="color: #1591DC; text-shadow: 0 0 25px rgba(21,145,220,0.7);">DISCIPLINE</span>
        </div>

        <div style="width: 100%; display: flex; justify-content: center;">
          <svg width="760" height="130" viewBox="0 0 760 130" fill="none" style="overflow: visible;">
            <line x1="20" y1="110" x2="740" y2="110" stroke="rgba(21,145,220,0.12)" stroke-width="1.5"/>
            <path d="M 40 110 Q 68 55 96 110 Q 124 55 152 110 Q 180 55 208 110 Q 236 55 264 110 Q 292 55 320 110 Q 348 55 376 110 Q 404 55 432 110 Q 460 55 488 110 Q 516 55 544 110 Q 572 55 600 110 Q 628 55 656 110 Q 684 55 712 110" 
                  stroke="#1591DC" stroke-width="2.8" fill="none"
                  style="filter: drop-shadow(0 0 10px rgba(21,145,220,0.55));"/>
            <circle cx="40" cy="110" r="5" fill="#ffffff"/>
            <circle cx="712" cy="110" r="6.5" fill="#ffffff" stroke="#1591DC" stroke-width="3"
                    style="filter: drop-shadow(0 0 14px #1591DC);"/>
          </svg>
        </div>
      </div>

    </div>

    <div style="display: flex; justify-content: space-between; width: 100%; font-size: 13px; color: #383b48; letter-spacing: 0.16em; position: relative; z-index: 10;" class="mono">
      <span>00:00:00:00</span>
      <span style="letter-spacing: 0.24em; font-weight: 600;">THOMASNGUYEN.ONLINE</span>
      <span>01:24:16:12</span>
    </div>

  </div>
</body>
</html>
