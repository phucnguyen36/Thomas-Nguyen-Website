<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 2 — This is Discipline (3:4 Minimal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #040507;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 140px 100px 90px;
    }
    /* Subtle cinematic grain */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      pointer-events-none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 680px;
      margin: auto 0;
      gap: 55px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #ffffff;
      text-transform: uppercase;
      text-align: center;
    }

    /* Chart Container */
    .chart-box {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
    }

    .chart-row {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .day-label {
      width: 50px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #727688;
      text-align: left;
    }

    .track {
      flex: 1;
      height: 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      background: #ffffff;
    }
    .bar.accent {
      background: linear-gradient(90deg, #ffffff 60%, #1591DC 100%);
      box-shadow: 0 0 16px rgba(21, 145, 220, 0.5);
    }
    .bar.low {
      background: #64687a;
    }

    .percent {
      width: 55px;
      font-size: 14px;
      font-weight: 600;
      color: #8c90a2;
      text-align: right;
    }
    .percent.highlight {
      color: #ffffff;
      font-weight: 700;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 500;
      color: #8c90a2;
      text-align: center;
      line-height: 1.5;
      letter-spacing: -0.01em;
      margin-top: 15px;
    }
    .subtitle span {
      color: #ffffff;
      font-weight: 700;
    }

    /* Watermark */
    .watermark {
      position: relative;
      z-index: 10;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.16em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <div class="main-container">
      <div class="title mono">THIS IS DISCIPLINE...</div>

      <div class="chart-box mono">
        <!-- MON -->
        <div class="chart-row">
          <div class="day-label">MON</div>
          <div class="track"><div class="bar accent" style="width: 100%;"></div></div>
          <div class="percent highlight">100%</div>
        </div>
        <!-- TUE -->
        <div class="chart-row">
          <div class="day-label">TUE</div>
          <div class="track"><div class="bar" style="width: 80%;"></div></div>
          <div class="percent">80%</div>
        </div>
        <!-- WED -->
        <div class="chart-row">
          <div class="day-label" style="color: #4b4e5c;">WED</div>
          <div class="track"><div class="bar low" style="width: 8%;"></div></div>
          <div class="percent" style="color: #4b4e5c;">8%</div>
        </div>
        <!-- THU -->
        <div class="chart-row">
          <div class="day-label">THU</div>
          <div class="track"><div class="bar" style="width: 25%;"></div></div>
          <div class="percent">25%</div>
        </div>
        <!-- FRI -->
        <div class="chart-row">
          <div class="day-label">FRI</div>
          <div class="track"><div class="bar" style="width: 70%;"></div></div>
          <div class="percent">70%</div>
        </div>
        <!-- SAT -->
        <div class="chart-row">
          <div class="day-label">SAT</div>
          <div class="track"><div class="bar accent" style="width: 90%;"></div></div>
          <div class="percent highlight">90%</div>
        </div>
        <!-- SUN -->
        <div class="chart-row">
          <div class="day-label" style="color: #4b4e5c;">SUN</div>
          <div class="track"><div class="bar low" style="width: 10%;"></div></div>
          <div class="percent" style="color: #4b4e5c;">10%</div>
        </div>
      </div>

      <div class="subtitle">
        It's not about 100% every day.<br>
        <span>It's about never hitting 0%.</span>
      </div>
    </div>

    <!-- Bottom Watermark (Strictly Lowercase) -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
