<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 2 — Continuity over Perfection (3:4 Ratio)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 90px 80px;
      background-color: #050608;
    }
    .bg-photo {
      position: absolute;
      inset: 0;
      background-image: url('bg_post_2.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.42) contrast(1.3) grayscale(55%);
      z-index: 1;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(4, 5, 8, 0.35) 0%, rgba(4, 5, 8, 0.85) 75%, rgba(4, 5, 8, 0.98) 100%),
                  linear-gradient(180deg, rgba(4, 5, 8, 0.85) 0%, transparent 25%, transparent 75%, rgba(4, 5, 8, 0.95) 100%);
      z-index: 2;
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.085;
      pointer-events-none;
      z-index: 3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .watermark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }
    .circle-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 65px;
      width: 100%;
      padding: 30px;
      background: radial-gradient(circle, rgba(4, 5, 8, 0.75) 0%, transparent 85%);
      border-radius: 24px;
    }
    .circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 320px;
    }
    .circle-svg {
      width: 210px;
      height: 210px;
    }
    .circle-caption {
      font-size: 19px;
      line-height: 1.4;
      text-align: center;
      font-weight: 600;
      text-shadow: 0 3px 15px rgba(0,0,0,0.9);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bg-photo"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="content">
      <div class="watermark mono">@THOMASVISUALEDITOR</div>

      <!-- Main Focus: Two Pinterest Circles -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 65px; margin: auto 0; width: 100%;">
        
        <div class="circle-card">
          <!-- Left Circle: Broken / Perfection -->
          <div class="circle-item">
            <svg class="circle-svg" viewBox="0 0 200 200">
              <path d="M 100 15 A 85 85 0 1 1 50 170" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" stroke-dasharray="8 6"/>
              <circle cx="50" cy="170" r="5" fill="rgba(255, 255, 255, 0.4)"/>
            </svg>
            <div class="circle-caption" style="color: rgba(255, 255, 255, 0.5);">
              Discipline is not about <br><span style="color: rgba(255, 255, 255, 0.7); text-decoration: line-through;">perfection</span>
            </div>
          </div>

          <!-- Right Circle: Complete Loop / Continuity in #1591DC -->
          <div class="circle-item">
            <svg class="circle-svg" viewBox="0 0 200 200" style="filter: drop-shadow(0 0 20px rgba(21, 145, 220, 0.4));">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1 L 10 5 L 0 9 z" fill="#1591DC"/>
                </marker>
              </defs>
              <circle cx="100" cy="100" r="85" fill="none" stroke="#1591DC" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
              <circle cx="100" cy="15" r="5.5" fill="#ffffff" stroke="#1591DC" stroke-width="2"/>
            </svg>
            <div class="circle-caption" style="color: #ffffff;">
              Discipline is about <br><span style="color: #1591DC; font-weight: 800;">continuity.</span>
            </div>
          </div>
        </div>

        <!-- Punchline -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
          <div style="font-size: 34px; line-height: 1.25; font-weight: 700; color: #ffffff; letter-spacing: -0.01em; text-shadow: 0 4px 20px rgba(0,0,0,0.95);">
            Show up when the render fails.<br>
            Show up when motivation dies.
          </div>
          <div class="mono" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #1591DC; text-transform: uppercase; background: rgba(21, 145, 220, 0.12); padding: 6px 18px; border-radius: 999px; border: 1px solid rgba(21, 145, 220, 0.3);">
            365 DAYS ON THE TIMELINE // 100% EXPORTED
          </div>
        </div>

      </div>

      <div class="footer mono">
        <span>00:00:00:00</span>
        <span style="letter-spacing: 0.28em; font-weight: 600;">THOMASNGUYEN.ONLINE</span>
        <span>CONTINUITY > TALENT</span>
      </div>
    </div>
  </div>
</body>
</html>
