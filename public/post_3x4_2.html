<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 2 — Timeline Discipline (Neue Haas Grotesk)</title>
  <style>
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-45Light-Trial.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-55Roman-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Neue Haas Grotesk', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #040507;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 130px 110px 80px;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events-none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 660px;
      margin: auto 0;
      gap: 52px;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: #ffffff;
      text-transform: uppercase;
      text-align: center;
    }

    /* Chart Container */
    .chart-box {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .chart-row {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .day-label {
      width: 50px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #727688;
      text-align: left;
    }

    .track {
      flex: 1;
      height: 12px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      background: #ffffff;
    }
    .bar.accent {
      background: linear-gradient(90deg, #ffffff 50%, #1591DC 100%);
      box-shadow: 0 0 16px rgba(21, 145, 220, 0.5);
    }
    .bar.low {
      background: #505465;
    }

    .hours {
      width: 50px;
      font-size: 15px;
      font-weight: 500;
      color: #8c90a2;
      text-align: right;
    }
    .hours.highlight {
      color: #ffffff;
      font-weight: 600;
    }

    .subtitle {
      font-size: 19px;
      font-weight: 400;
      color: #8c90a2;
      text-align: center;
      line-height: 1.6;
      letter-spacing: -0.01em;
      margin-top: 10px;
    }
    .subtitle strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Watermark */
    .watermark {
      position: relative;
      z-index: 10;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <div class="main-container">
      <div class="title">HOURS ON THE TIMELINE...</div>

      <div class="chart-box">
        <!-- MON -->
        <div class="chart-row">
          <div class="day-label">MON</div>
          <div class="track"><div class="bar accent" style="width: 100%;"></div></div>
          <div class="hours highlight">10h</div>
        </div>
        <!-- TUE -->
        <div class="chart-row">
          <div class="day-label">TUE</div>
          <div class="track"><div class="bar" style="width: 80%;"></div></div>
          <div class="hours">8h</div>
        </div>
        <!-- WED -->
        <div class="chart-row">
          <div class="day-label" style="color: #4b4e5c;">WED</div>
          <div class="track"><div class="bar low" style="width: 15%;"></div></div>
          <div class="hours" style="color: #4b4e5c;">1.5h</div>
        </div>
        <!-- THU -->
        <div class="chart-row">
          <div class="day-label">THU</div>
          <div class="track"><div class="bar" style="width: 30%;"></div></div>
          <div class="hours">3h</div>
        </div>
        <!-- FRI -->
        <div class="chart-row">
          <div class="day-label">FRI</div>
          <div class="track"><div class="bar" style="width: 75%;"></div></div>
          <div class="hours">7.5h</div>
        </div>
        <!-- SAT -->
        <div class="chart-row">
          <div class="day-label">SAT</div>
          <div class="track"><div class="bar accent" style="width: 90%;"></div></div>
          <div class="hours highlight">9h</div>
        </div>
        <!-- SUN -->
        <div class="chart-row">
          <div class="day-label" style="color: #4b4e5c;">SUN</div>
          <div class="track"><div class="bar low" style="width: 20%;"></div></div>
          <div class="hours" style="color: #4b4e5c;">2h</div>
        </div>
      </div>

      <div class="subtitle">
        Some days you cut 50 scenes.<br>
        Some days you fight for one cut.<br>
        <strong>Both keep the timeline moving.</strong>
      </div>
    </div>

    <!-- Bottom Watermark -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
