<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 3 — Decision Tree (3:4 Minimal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #040507;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 120px 80px 80px;
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      pointer-events-none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      margin: auto 0;
    }

    .tree-svg {
      width: 820px;
      height: 520px;
    }

    /* Node Text Styles */
    .node-root {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 28px;
      font-weight: 600;
      fill: #ffffff;
      letter-spacing: -0.01em;
    }
    .node-mid {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 500;
      fill: #c6c9d6;
    }
    .node-mid-dim {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 500;
      fill: #727688;
    }
    .node-win {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 700;
      fill: #1591DC;
      filter: drop-shadow(0 0 14px rgba(21, 145, 220, 0.7));
    }
    .node-lose {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 500;
      fill: #5a5e70;
    }

    /* Watermark */
    .watermark {
      position: relative;
      z-index: 10;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.16em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <div class="main-container">
      <svg class="tree-svg" viewBox="0 0 760 460">
        <!-- Connecting Lines -->
        <!-- Root to Mid Branch -->
        <path d="M 120 230 L 220 230 C 240 230, 240 125, 260 125 L 340 125" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.2" />
        <path d="M 120 230 L 220 230 C 240 230, 240 335, 260 335 L 340 335" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2.2" />

        <!-- Mid Try to Win / Lose Branches -->
        <path d="M 400 125 L 470 125 C 490 125, 490 65, 510 65 L 580 65" fill="none" stroke="#1591DC" stroke-width="2.5" />
        <path d="M 400 125 L 470 125 C 490 125, 490 185, 510 185 L 580 185" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

        <!-- Mid Don't Try to Lose Branch -->
        <path d="M 470 335 L 580 335" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

        <!-- Nodes -->
        <!-- Root -->
        <circle cx="120" cy="230" r="4.5" fill="#ffffff" />
        <text x="30" y="238" class="node-root">If you</text>

        <!-- Mid 1: Try -->
        <circle cx="340" cy="125" r="4" fill="#ffffff" />
        <text x="355" y="133" class="node-mid">Try</text>

        <!-- Mid 2: Don't try -->
        <circle cx="340" cy="335" r="4" fill="#606475" />
        <text x="355" y="343" class="node-mid-dim">Don't try</text>

        <!-- Leaves -->
        <!-- Win -->
        <circle cx="580" cy="65" r="5" fill="#1591DC" filter="drop-shadow(0 0 8px #1591DC)" />
        <text x="605" y="74" class="node-win">Win</text>

        <!-- Lose (from Try) -->
        <circle cx="580" cy="185" r="4" fill="#5a5e70" />
        <text x="605" y="193" class="node-lose">Lose</text>

        <!-- Lose (from Don't try) -->
        <circle cx="580" cy="335" r="4" fill="#484c5c" />
        <text x="605" y="343" class="node-lose">Lose</text>
      </svg>
    </div>

    <!-- Bottom Watermark (Strictly Lowercase) -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
