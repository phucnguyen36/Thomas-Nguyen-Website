<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 3 — The Professional Standard (Neue Haas Grotesk)</title>
  <style>
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-45Light-Trial.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-55Roman-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Neue Haas Grotesk', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #040507;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 100px 40px 80px;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events-none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      margin: auto 0;
      gap: 55px;
    }

    .tree-svg {
      width: 1000px;
      height: 520px;
    }

    /* Node Text Styles in Neue Haas Grotesk */
    .node-root {
      font-size: 24px;
      font-weight: 600;
      fill: #ffffff;
      letter-spacing: -0.01em;
      text-anchor: end;
    }
    .node-mid-dim {
      font-size: 20px;
      font-weight: 500;
      fill: #6e7284;
    }
    .node-mid-bright {
      font-size: 21px;
      font-weight: 600;
      fill: #ffffff;
    }
    .leaf-text {
      font-size: 18px;
      font-weight: 400;
      fill: #a2a6b8;
    }
    .leaf-text-dim {
      font-size: 18px;
      font-weight: 400;
      fill: #5b6072;
    }
    .leaf-win {
      font-size: 19px;
      font-weight: 600;
      fill: #1591DC;
      filter: drop-shadow(0 0 14px rgba(21, 145, 220, 0.7));
    }

    .outcome-tag {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .punchline {
      font-size: 20px;
      font-weight: 400;
      color: #8c90a2;
      text-align: center;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }
    .punchline strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Watermark */
    .watermark {
      position: relative;
      z-index: 10;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <div class="main-container">
      <svg class="tree-svg" viewBox="0 0 1020 520">
        <!-- Connecting Curves -->
        <!-- Root to Top Mid (Amateur trap) -->
        <path d="M 140 260 L 210 260 C 230 260, 230 140, 250 140 L 360 140" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" />
        
        <!-- Root to Bottom Mid (Professional standard) -->
        <path d="M 140 260 L 210 260 C 230 260, 230 380, 250 380 L 380 380" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.2" />

        <!-- Top Mid to Leaf 1 (Doubt choices) -->
        <path d="M 360 140 L 410 140 C 430 140, 430 80, 450 80 L 490 80" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="2" />
        
        <!-- Top Mid to Leaf 2 (Resist change) -->
        <path d="M 360 140 L 410 140 C 430 140, 430 200, 450 200 L 490 200" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="2" />

        <!-- Bottom Mid to Leaf 3 (Commit to your cut) -->
        <path d="M 380 380 L 430 380 C 450 380, 450 320, 470 320 L 510 320" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2.2" />
        
        <!-- Bottom Mid to Leaf 4 (Adapt & learn daily - Cyan Glow) -->
        <path d="M 380 380 L 430 380 C 450 380, 450 440, 470 440 L 510 440" fill="none" stroke="#1591DC" stroke-width="2.6" />

        <!-- Nodes & Labels -->
        <!-- Root -->
        <circle cx="140" cy="260" r="4.5" fill="#ffffff" />
        <text x="120" y="267" class="node-root">The craft</text>

        <!-- Top Mid: Amateur Trap -->
        <circle cx="360" cy="140" r="4" fill="#585c6d" />
        <text x="210" y="130" class="node-mid-dim">Amateur mindset</text>

        <!-- Leaf 1: Doubt choices & copy trends -->
        <circle cx="490" cy="80" r="4" fill="#424654" />
        <text x="515" y="86" class="leaf-text-dim">Doubt choices & copy trends <tspan class="outcome-tag" fill="#424654" dx="10">→ LOST IDENTITY</tspan></text>

        <!-- Leaf 2: Resist change & stop learning -->
        <circle cx="490" cy="200" r="4" fill="#424654" />
        <text x="515" y="206" class="leaf-text-dim">Resist change & stop learning <tspan class="outcome-tag" fill="#424654" dx="10">→ STAGNANT SKILLS</tspan></text>

        <!-- Bottom Mid: Professional Standard -->
        <circle cx="380" cy="380" r="4.5" fill="#ffffff" />
        <text x="180" y="370" class="node-mid-bright">Professional standard</text>

        <!-- Leaf 3: Commit to your creative cut -->
        <circle cx="510" cy="320" r="4" fill="#a2a6b8" />
        <text x="535" y="326" class="leaf-text">Commit to your creative cut <tspan class="outcome-tag" fill="#a2a6b8" dx="10">→ SIGNATURE VOICE</tspan></text>

        <!-- Leaf 4: Adapt & learn every day -->
        <circle cx="510" cy="440" r="5.5" fill="#1591DC" filter="drop-shadow(0 0 8px #1591DC)" />
        <text x="535" y="446" class="leaf-win">Adapt & learn every day <tspan class="outcome-tag" fill="#1591DC" dx="10">→ IRREPLACEABLE (WIN)</tspan></text>
      </svg>

      <div class="punchline">
        Clients don't hire software operators.<br>
        <strong>They hire editors with standards.</strong>
      </div>
    </div>

    <!-- Bottom Watermark -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
