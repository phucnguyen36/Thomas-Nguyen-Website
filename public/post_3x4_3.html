<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 3 — Editor Standard (Clean 3:4 Minimal)</title>
  <style>
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-45Light-Trial.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-55Roman-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Neue Haas Grotesk', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #040507;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 120px 40px 80px;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events-none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      margin: auto 0;
      gap: 60px;
    }

    .tree-svg {
      width: 960px;
      height: 480px;
    }

    /* Node Text Styles */
    .node-root {
      font-size: 26px;
      font-weight: 600;
      fill: #ffffff;
      letter-spacing: -0.01em;
      text-anchor: end;
    }
    .node-mid {
      font-size: 22px;
      font-weight: 500;
      fill: #d2d5e2;
    }
    .node-mid-dim {
      font-size: 22px;
      font-weight: 400;
      fill: #686c7d;
    }
    .node-win {
      font-size: 23px;
      font-weight: 600;
      fill: #1591DC;
      filter: drop-shadow(0 0 14px rgba(21, 145, 220, 0.75));
    }
    .node-sub {
      font-size: 21px;
      font-weight: 400;
      fill: #9498a9;
    }
    .node-lose {
      font-size: 21px;
      font-weight: 400;
      fill: #4c5060;
    }

    .tag-note {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .punchline {
      font-size: 20px;
      font-weight: 400;
      color: #8c90a2;
      text-align: center;
      line-height: 1.55;
      letter-spacing: -0.01em;
    }
    .punchline strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Watermark */
    .watermark {
      position: relative;
      z-index: 10;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <div class="main-container">
      <svg class="tree-svg" viewBox="0 0 980 460">
        <!-- Connecting Lines -->
        <!-- Root to Branch 1 (Commit & Adapt) -->
        <path d="M 150 230 L 220 230 C 240 230, 240 130, 260 130 L 280 130" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.2" />
        
        <!-- Root to Branch 2 (Copy & Settle) -->
        <path d="M 150 230 L 220 230 C 240 230, 240 330, 260 330 L 280 330" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" />

        <!-- Branch 1 to Win (Mastery) in Electric Cyan #1591DC -->
        <path d="M 535 130 L 590 130 C 615 130, 615 70, 640 70 L 685 70" fill="none" stroke="#1591DC" stroke-width="2.6" />
        
        <!-- Branch 1 to Progress (Growth) -->
        <path d="M 535 130 L 590 130 C 615 130, 615 190, 640 190 L 685 190" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" />

        <!-- Branch 2 to Lose (Stagnation) -->
        <path d="M 525 330 L 685 330" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="2" />

        <!-- Nodes & Clean Text Labels -->
        <!-- Root -->
        <circle cx="150" cy="230" r="4.5" fill="#ffffff" />
        <text x="130" y="238" class="node-root">If you</text>

        <!-- Mid 1: Commit & Learn -->
        <circle cx="280" cy="130" r="4" fill="#ffffff" />
        <text x="300" y="137" class="node-mid">Commit & learn daily</text>

        <!-- Mid 2: Copy & Settle -->
        <circle cx="280" cy="330" r="4" fill="#5a5e70" />
        <text x="300" y="337" class="node-mid-dim">Copy & doubt choices</text>

        <!-- Leaves -->
        <!-- Mastery (WIN) -->
        <circle cx="685" cy="70" r="5" fill="#1591DC" filter="drop-shadow(0 0 8px #1591DC)" />
        <text x="710" y="77" class="node-win">Mastery <tspan class="tag-note" fill="#1591DC" dx="6">(WIN)</tspan></text>

        <!-- Growth (PROGRESS) -->
        <circle cx="685" cy="190" r="4" fill="#888c9e" />
        <text x="710" y="197" class="node-sub">Growth <tspan class="tag-note" fill="#888c9e" dx="6">(PROGRESS)</tspan></text>

        <!-- Stagnation (LOSE) -->
        <circle cx="685" cy="330" r="4" fill="#444756" />
        <text x="710" y="337" class="node-lose">Stagnation <tspan class="tag-note" fill="#444756" dx="6">(LOSE)</tspan></text>
      </svg>

      <div class="punchline">
        Clients don't hire software operators.<br>
        <strong>They hire editors with standards.</strong>
      </div>
    </div>

    <!-- Bottom Watermark -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
