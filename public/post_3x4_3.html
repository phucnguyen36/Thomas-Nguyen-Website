<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 3 — Editor Decision Tree (Neue Haas Grotesk)</title>
  <style>
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-45Light-Trial.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-55Roman-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/NeueHaasGrotDisp-65Medium-Trial.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Neue Haas Grotesk', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 3:4 Aspect Ratio (1080 x 1440) */
    .canvas {
      width: 1080px;
      height: 1440px;
      background-color: #040507;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 100px 70px 80px;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events-none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      margin: auto 0;
      gap: 50px;
    }

    .tree-svg {
      width: 940px;
      height: 520px;
    }

    /* Node Text Styles in Neue Haas Grotesk */
    .node-root {
      font-size: 26px;
      font-weight: 600;
      fill: #ffffff;
      letter-spacing: -0.01em;
    }
    .node-mid {
      font-size: 22px;
      font-weight: 500;
      fill: #c6c9d6;
    }
    .node-mid-dim {
      font-size: 22px;
      font-weight: 400;
      fill: #6e7284;
    }
    .node-win {
      font-size: 24px;
      font-weight: 600;
      fill: #1591DC;
      filter: drop-shadow(0 0 14px rgba(21, 145, 220, 0.7));
    }
    .node-sub {
      font-size: 22px;
      font-weight: 400;
      fill: #9ea2b4;
    }
    .node-lose {
      font-size: 22px;
      font-weight: 400;
      fill: #55596b;
    }

    .tag-note {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .punchline {
      font-size: 19px;
      font-weight: 400;
      color: #8c90a2;
      text-align: center;
      letter-spacing: -0.01em;
    }
    .punchline strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Watermark */
    .watermark {
      position: relative;
      z-index: 10;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.18em;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>

    <div class="main-container">
      <svg class="tree-svg" viewBox="0 0 960 480">
        <!-- Connecting Curves -->
        <!-- Root to Mid Branch 1 (Open Timeline) -->
        <path d="M 130 240 L 210 240 C 235 240, 235 130, 260 130 L 450 130" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.2" />
        
        <!-- Root to Mid Branch 2 (Wait for Inspiration) -->
        <path d="M 130 240 L 210 240 C 235 240, 235 350, 260 350 L 460 350" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" />

        <!-- Open Timeline to Master Cut (Cyan #1591DC) -->
        <path d="M 450 130 L 500 130 C 525 130, 525 70, 550 70 L 620 70" fill="none" stroke="#1591DC" stroke-width="2.6" />
        
        <!-- Open Timeline to Rough Cut -->
        <path d="M 450 130 L 500 130 C 525 130, 525 190, 550 190 L 620 190" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" />

        <!-- Wait for Inspiration to Zero Exports -->
        <path d="M 460 350 L 620 350" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

        <!-- Nodes -->
        <!-- Root -->
        <circle cx="130" cy="240" r="4.5" fill="#ffffff" />
        <text x="45" y="247" class="node-root">If you</text>

        <!-- Mid 1: Open Timeline -->
        <circle cx="450" cy="130" r="4" fill="#ffffff" />
        <text x="260" y="120" class="node-mid">Sit at the timeline</text>

        <!-- Mid 2: Wait for Inspiration -->
        <circle cx="460" cy="350" r="4" fill="#606475" />
        <text x="260" y="340" class="node-mid-dim">Wait for inspiration</text>

        <!-- Leaves -->
        <!-- Master Cut (Win) -->
        <circle cx="620" cy="70" r="5" fill="#1591DC" filter="drop-shadow(0 0 8px #1591DC)" />
        <text x="645" y="77" class="node-win">Master Cut <tspan class="tag-note" fill="#1591DC" dx="6">(WIN)</tspan></text>

        <!-- Rough Cut (Progress) -->
        <circle cx="620" cy="190" r="4" fill="#7a7e90" />
        <text x="645" y="197" class="node-sub">Rough Cut <tspan class="tag-note" fill="#7a7e90" dx="6">(PROGRESS)</tspan></text>

        <!-- Zero Exports (Lose) -->
        <circle cx="620" cy="350" r="4" fill="#464a59" />
        <text x="645" y="357" class="node-lose">0 Exports <tspan class="tag-note" fill="#464a59" dx="6">(LOSE)</tspan></text>
      </svg>

      <div class="punchline">
        Inspiration doesn't start the edit.<br>
        <strong>The edit creates inspiration.</strong>
      </div>
    </div>

    <!-- Bottom Watermark -->
    <div class="watermark">
      thomasvisualeditor
    </div>
  </div>
</body>
</html>
