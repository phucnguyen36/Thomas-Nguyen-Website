<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 3 — Don't Rely on Motivation / Rely on Discipline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .canvas {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 85px 80px;
      background-color: #050608;
    }
    /* Photographic Background Layer */
    .bg-photo {
      position: absolute;
      inset: 0;
      background-image: url('bg_post_3.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.42) contrast(1.3) grayscale(40%);
      z-index: 1;
    }
    /* Dark Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(4, 5, 8, 0.35) 0%, rgba(4, 5, 8, 0.85) 75%, rgba(4, 5, 8, 0.98) 100%),
                  linear-gradient(180deg, rgba(4, 5, 8, 0.85) 0%, transparent 25%, transparent 75%, rgba(4, 5, 8, 0.95) 100%);
      z-index: 2;
    }
    /* Film Grain Noise */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.085;
      pointer-events-none;
      z-index: 3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .watermark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }
    .curve-card {
      display: flex;
      flex-direction: column;
      gap: 50px;
      width: 100%;
      max-width: 700px;
    }
    .curve-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .curve-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bg-photo"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="content">
      <!-- Top Watermark -->
      <div class="watermark mono">@THOMASVISUALEDITOR</div>

      <!-- Main Focus: Don't Rely on Motivation / Rely on Discipline -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 60px; margin: auto 0; width: 100%;">
        
        <div class="curve-card">
          <!-- TOP: MOTIVATION (FADES OUT) -->
          <div class="curve-row">
            <div class="curve-title mono" style="color: rgba(255, 255, 255, 0.45);">
              DON'T RELY ON MOTIVATION
            </div>
            <svg viewBox="0 0 700 80" style="width: 100%; height: 75px; overflow: visible;">
              <!-- Base line -->
              <line x1="0" y1="70" x2="700" y2="70" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
              <!-- Dying bounces -->
              <path d="M 0 70 Q 70 -10 140 70 Q 190 20 240 70 Q 275 45 310 70" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.5"/>
              <!-- Flat dotted line dying out -->
              <line x1="310" y1="70" x2="650" y2="70" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" stroke-dasharray="4 6"/>
              <!-- Start / dying dots -->
              <circle cx="0" cy="70" r="4" fill="rgba(255, 255, 255, 0.5)"/>
              <circle cx="310" cy="70" r="4" fill="rgba(255, 255, 255, 0.35)"/>
            </svg>
          </div>

          <!-- BOTTOM: DISCIPLINE (CONTINUOUS RHYTHM IN #1591DC) -->
          <div class="curve-row">
            <div class="curve-title mono" style="color: #1591DC; font-weight: 800;">
              RELY ON DISCIPLINE
            </div>
            <svg viewBox="0 0 700 80" style="width: 100%; height: 75px; overflow: visible; filter: drop-shadow(0 0 15px rgba(21, 145, 220, 0.35));">
              <!-- Base line -->
              <line x1="0" y1="70" x2="700" y2="70" stroke="rgba(21, 145, 220, 0.25)" stroke-width="1.5"/>
              <!-- Continuous rhythmic bounces -->
              <path d="M 0 70 Q 30 25 60 70 Q 90 25 120 70 Q 150 25 180 70 Q 210 25 240 70 Q 270 25 300 70 Q 330 25 360 70 Q 390 25 420 70 Q 450 25 480 70 Q 510 25 540 70 Q 570 25 600 70 Q 630 25 660 70 L 685 70" 
                    fill="none" stroke="#1591DC" stroke-width="3"/>
              <!-- Glowing active playhead / leading dot -->
              <circle cx="660" cy="70" r="6" fill="#ffffff" stroke="#1591DC" stroke-width="2.5" style="filter: drop-shadow(0 0 10px #1591DC);"/>
            </svg>
          </div>
        </div>

        <!-- Single Core Punchline -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
          <div style="font-size: 32px; line-height: 1.25; font-weight: 700; color: #ffffff; letter-spacing: -0.01em; text-shadow: 0 4px 20px rgba(0,0,0,0.95);">
            Amateurs wait for inspiration.<br>
            Editors sit at the timeline.
          </div>
          <div class="mono" style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #1591DC; text-transform: uppercase; background: rgba(21, 145, 220, 0.12); padding: 6px 18px; border-radius: 999px; border: 1px solid rgba(21, 145, 220, 0.3);">
            KEYFRAME: EASY EASE [F9] // 85%+ RETENTION
          </div>
        </div>

      </div>

      <!-- Bottom Footer -->
      <div class="footer mono">
        <span>00:00:00:00</span>
        <span style="letter-spacing: 0.28em; font-weight: 600;">THOMASNGUYEN.ONLINE</span>
        <span>RHYTHM > LUCK</span>
      </div>
    </div>
  </div>
</body>
</html>
